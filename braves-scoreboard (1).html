<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlanta Braves Scoreboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #13274F;
    --red: #CE1141;
    --gold: #EAAA00;
    --white: #F5F0E8;
    --gray: #8a8a8a;
    --dark: #0a1829;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: var(--white);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255,255,255,0.012) 3px,
        rgba(255,255,255,0.012) 4px
      );
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 36px 48px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 44px;
    border-bottom: 3px solid var(--red);
    padding-bottom: 28px;
  }

  .team-logo-img {
    width: 110px;
    height: 110px;
    object-fit: contain;
    filter: drop-shadow(0 2px 12px rgba(206,17,65,0.4));
    flex-shrink: 0;
  }

  .header-text h1 {
    font-family: 'Bebas Neue', cursive;
    font-size: 72px;
    letter-spacing: 4px;
    color: var(--white);
    line-height: 1;
  }

  .header-text .season-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    color: var(--gold);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .header-right {
    margin-left: auto;
    text-align: right;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--red);
    color: white;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    letter-spacing: 3px;
    padding: 7px 16px;
    border-radius: 2px;
    margin-bottom: 8px;
  }

  .live-dot {
    width: 9px;
    height: 9px;
    background: white;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .last-updated {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--gray);
    letter-spacing: 1px;
  }

  /* ── Section label ── */
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    letter-spacing: 5px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* ── Game Cards ── */
  .games-grid {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .game-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-left: 6px solid transparent;
    padding: 32px 36px;
    display: grid;
    grid-template-columns: 1fr auto 1fr auto;
    align-items: center;
    gap: 24px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 0.4s forwards;
  }

  .game-card.live     { border-left-color: var(--red); background: rgba(206,17,65,0.07); }
  .game-card.win      { border-left-color: var(--gold); }
  .game-card.loss     { border-left-color: rgba(255,255,255,0.15); }
  .game-card.upcoming { border-left-color: var(--navy); opacity: 0.88; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Team blocks ── */
  .team-block { display: flex; align-items: center; gap: 20px; }
  .team-block.away { flex-direction: row; }
  .team-block.home { flex-direction: row-reverse; text-align: right; }

  .team-logo-small {
    width: 72px;
    height: 72px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .team-abbr {
    font-family: 'Bebas Neue', cursive;
    font-size: 52px;
    letter-spacing: 3px;
    line-height: 1;
  }

  .team-name-small {
    font-size: 16px;
    color: var(--gray);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .team-record {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--gray);
    margin-top: 4px;
  }

  /* ── Score ── */
  .score-block {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 200px;
    justify-content: center;
  }

  .score {
    font-family: 'Bebas Neue', cursive;
    font-size: 88px;
    line-height: 1;
    letter-spacing: 3px;
    min-width: 72px;
    text-align: center;
  }

  .score.winner   { color: var(--gold); }
  .score.loser    { color: var(--gray); }
  .score.upcoming { color: rgba(255,255,255,0.18); font-size: 56px; }

  .score-divider {
    font-family: 'Bebas Neue', cursive;
    font-size: 44px;
    color: rgba(255,255,255,0.15);
  }

  /* ── Status block ── */
  .status-block {
    min-width: 160px;
    text-align: center;
  }

  .game-date-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--gray);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .status-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    letter-spacing: 2px;
    padding: 7px 18px;
    border-radius: 2px;
    display: inline-block;
  }

  .status-badge.live {
    background: var(--red);
    color: white;
    animation: glow 2s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { box-shadow: 0 0 6px rgba(206,17,65,0.4); }
    to   { box-shadow: 0 0 18px rgba(206,17,65,0.9); }
  }

  .status-badge.final    { background: rgba(255,255,255,0.08); color: var(--gray); }
  .status-badge.upcoming { background: rgba(234,170,0,0.1); color: var(--gold); border: 1px solid rgba(234,170,0,0.3); }

  .game-venue {
    font-size: 13px;
    color: rgba(255,255,255,0.22);
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.5px;
  }

  /* ── Loading / Error ── */
  .loading-state, .error-state {
    text-align: center;
    padding: 80px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    color: var(--gray);
    letter-spacing: 2px;
  }

  .loading-spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .no-games {
    text-align: center;
    padding: 60px;
    color: var(--gray);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <img
      class="team-logo-img"
      src="https://www.mlbstatic.com/team-logos/144.svg"
      alt="Atlanta Braves"
      onerror="this.onerror=null;this.style.display='none';document.getElementById('logo-fallback').style.display='flex';"
    />
    <div id="logo-fallback" style="display:none;width:110px;height:110px;background:var(--red);border-radius:50%;align-items:center;justify-content:center;font-family:'Bebas Neue',cursive;font-size:36px;color:var(--white);box-shadow:0 0 0 4px var(--gold);">ATL</div>

    <div class="header-text">
      <h1>Atlanta Braves</h1>
      <div class="season-label">2026 Season · Live Scoreboard</div>
    </div>
    <div class="header-right">
      <div class="live-badge"><span class="live-dot"></span> LIVE DATA</div>
      <div class="last-updated" id="last-updated">Updating...</div>
    </div>
  </div>

  <div class="section-label" id="games-label">Recent &amp; Upcoming Games</div>
  <div class="games-grid" id="games-container">
    <div class="loading-state">
      <div class="loading-spinner"></div>
      LOADING GAMES...
    </div>
  </div>

</div>

<script>
  const BRAVES_ID = 144;

  function formatTime(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function getGameStatus(game) {
    const code = game.status?.codedGameState;
    if (code === 'I') return 'live';
    if (code === 'F' || code === 'O') return 'final';
    return 'upcoming';
  }

  function renderGames(games) {
    const container = document.getElementById('games-container');
    if (!games || games.length === 0) {
      container.innerHTML = '<div class="no-games">NO GAMES FOUND FOR THIS PERIOD</div>';
      return;
    }

    container.innerHTML = games.map((game, i) => {
      const away = game.teams.away;
      const home = game.teams.home;
      const status = getGameStatus(game);

      const awayScore = away.score ?? null;
      const homeScore = home.score ?? null;
      const awayWin = status === 'final' && awayScore > homeScore;
      const homeWin = status === 'final' && homeScore > awayScore;

      const bravesWon  = (home.team.id === BRAVES_ID && homeWin) || (away.team.id === BRAVES_ID && awayWin);
      const bravesLost = (home.team.id === BRAVES_ID && awayWin) || (away.team.id === BRAVES_ID && homeWin);

      let cardClass = 'game-card';
      if (status === 'live') cardClass += ' live';
      else if (status === 'final' && bravesWon)  cardClass += ' win';
      else if (status === 'final' && bravesLost) cardClass += ' loss';
      else cardClass += ' upcoming';

      let statusHTML = '';
      if (status === 'live') {
        const inning = game.linescore?.currentInning || '';
        const half   = game.linescore?.inningHalf || '';
        statusHTML = `<span class="status-badge live">${half.toUpperCase().charAt(0)} ${inning}</span>`;
      } else if (status === 'final') {
        statusHTML = `<span class="status-badge final">FINAL</span>`;
      } else {
        const gameTime = game.gameDate ? formatTime(game.gameDate) : 'TBD';
        statusHTML = `<span class="status-badge upcoming">${gameTime}</span>`;
      }

      const awayScoreClass = status === 'upcoming' ? 'upcoming' : (awayWin ? 'winner' : 'loser');
      const homeScoreClass = status === 'upcoming' ? 'upcoming' : (homeWin ? 'winner' : 'loser');
      const scoreDisplay = status === 'upcoming'
        ? `<div class="score upcoming">-</div><div class="score-divider">VS</div><div class="score upcoming">-</div>`
        : `<div class="score ${awayScoreClass}">${awayScore ?? 0}</div><div class="score-divider">·</div><div class="score ${homeScoreClass}">${homeScore ?? 0}</div>`;

      const awayRec  = away.leagueRecord ? `${away.leagueRecord.wins}-${away.leagueRecord.losses}` : '';
      const homeRec  = home.leagueRecord ? `${home.leagueRecord.wins}-${home.leagueRecord.losses}` : '';
      const venue    = game.venue?.name || '';
      const gameDate = formatDate(game.officialDate || game.gameDate?.split('T')[0]);

      return `
        <div class="${cardClass}" style="animation-delay:${i * 0.08}s">
          <div class="team-block away">
            <img class="team-logo-small" src="https://www.mlbstatic.com/team-logos/${away.team.id}.svg" alt="${away.team.abbreviation}" onerror="this.style.display='none'"/>
            <div>
              <div class="team-abbr">${away.team.abbreviation}</div>
              <div class="team-name-small">${away.team.teamName}</div>
              <div class="team-record">${awayRec}</div>
            </div>
          </div>

          <div class="score-block">${scoreDisplay}</div>

          <div class="team-block home">
            <img class="team-logo-small" src="https://www.mlbstatic.com/team-logos/${home.team.id}.svg" alt="${home.team.abbreviation}" onerror="this.style.display='none'"/>
            <div>
              <div class="team-abbr">${home.team.abbreviation}</div>
              <div class="team-name-small">${home.team.teamName}</div>
              <div class="team-record">${homeRec}</div>
            </div>
          </div>

          <div class="status-block">
            <div class="game-date-label">${gameDate}</div>
            ${statusHTML}
            <div class="game-venue">${venue}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  async function fetchData() {
    const today = new Date();
    const startDate = new Date(today);
    startDate.setDate(today.getDate() - 4);
    const endDate = new Date(today);
    endDate.setDate(today.getDate() + 5);

    const fmt = d => d.toISOString().split('T')[0];

    try {
      const res  = await fetch(
        `https://statsapi.mlb.com/api/v1/schedule?teamId=${BRAVES_ID}&startDate=${fmt(startDate)}&endDate=${fmt(endDate)}&sportId=1&hydrate=team,linescore,venue`
      );
      const data = await res.json();

      const allGames = [];
      for (const dateObj of data.dates || []) {
        for (const game of dateObj.games) allGames.push(game);
      }

      allGames.sort((a, b) => new Date(a.gameDate) - new Date(b.gameDate));

      const liveGames     = allGames.filter(g => getGameStatus(g) === 'live');
      const pastGames     = allGames.filter(g => getGameStatus(g) === 'final').slice(-2);
      const upcomingGames = allGames.filter(g => getGameStatus(g) === 'upcoming').slice(0, 1);

      const display = [...liveGames, ...pastGames, ...upcomingGames]
        .sort((a, b) => new Date(a.gameDate) - new Date(b.gameDate));

      renderGames(display);

      document.getElementById('games-label').textContent = liveGames.length
        ? '🔴 Live Game · Recent & Upcoming'
        : 'Recent & Upcoming Games';

    } catch (err) {
      document.getElementById('games-container').innerHTML =
        `<div class="error-state">UNABLE TO LOAD GAMES<br><small style="font-size:13px;opacity:0.5;margin-top:10px;display:block">${err.message}</small></div>`;
    }

    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  fetchData();
  setInterval(fetchData, 60000);
</script>
</body>
</html>
